name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format libsdl2-dev libgl1-mesa-dev xvfb
      - name: Check C++ formatting
        run: >-
          git ls-files -z -- '*.cc' '*.hh' |
          xargs -0 -r clang-format --style=file:.clang-format --dry-run --Werror
      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_BUILD_TYPE=Release
          -DZGUI_BUILD_TESTS=ON
          -DZGUI_BUILD_BACKEND_SDL2_OPENGL=ON
          -DZGUI_BUILD_EXAMPLES=ON
          -DZGUI_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Run classic example smoke test
        run: >-
          timeout 60s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1
          build/ci/examples/zgui_classic_example --frames 60
